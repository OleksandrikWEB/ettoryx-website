server {
    listen 80;
    server_name ettoryx.com www.ettoryx.com;

    # для видачі Let's Encrypt сертифіката
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ДО отримання сертифіката залиш тільки цей блок (закоментуй HTTPS-сервер нижче).
    # ПІСЛЯ першого успішного certbot-запуску розкоментуй редірект і HTTPS-блок.

    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

